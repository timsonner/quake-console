# Quake console. Only the agent window (the drop-down console) loads this.
# Colors come from the Omarchy theme, the same ones a normal Foot window uses.
# The face stays QuakeConsole, at this size. The window stays see-through.
# The face is the Quake outlines, tinted by the cell color. A color bitmap
# kept its own light ink, so a selection bar washed the letters out.
# Copy-paste selection is a GrokNight gray.

[main]
include=~/.config/foot/foot.ini
font=QuakeConsole:pixelsize=18,JetBrainsMono Nerd Font:size=8.25
pad=6x4

[cursor]
style=block
blink=yes
blink-rate=500

[colors-dark]
selection-foreground=b2b2b2
selection-background=383838

[colors-light]
selection-foreground=b2b2b2
selection-background=383838
